[project]
name = "umlsl-edit"
version = "2026.5.2"
description = "Visual traffic-snapshot editor and UMLSL model checker"
requires-python = ">= 3.11"
readme = "README.md"
dependencies = [
    "PySide6==6.10.1",
    "networkx==3.6.1",
    "matplotlib==3.10.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.urls]
Repository = "https://github.com/QaisHamarneh/umlsl-toolkit"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umlsl_edit = [
    "**/*.ui",
    "**/*.qrc",
    "**/*.qml",
    "**/*.svg",
    "**/*.png",
]
