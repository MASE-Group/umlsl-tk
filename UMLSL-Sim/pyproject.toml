[project]
name = "umlsl-sim"
version = "2026.5.2"
description = "Discrete-time traffic simulator and Gymnasium environment for UMLSL"
requires-python = ">= 3.11"
authors = [
    {name = "Qais Hamarneh", email = "qais.hamarneh@kit.edu"},
    {name = "Sven Löchte"},
    {name = "Cornelius Niese", email = "cornelius.niese@student.kit.edu"}
]
readme = "README.md"
dependencies = [
    "pyglet>=2.0.9",
    "numpy>=1.26.1"
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.2.0",
    "stable-baselines3>=2.7.0",
    # MaskablePPO, used by the safety-shield training mechanism.
    "sb3-contrib>=2.7.0",
    "tqdm>=4.67.1",
    "rich>=14.1.0",
    "optuna>=4.5.0",
    # rl_io reads/writes the best-hyperparameter parquet through pandas;
    # pyarrow is the parquet engine behind it.
    "pandas>=2.2.0",
    "pyarrow>=22.0.0",
    "plotly>=6.5.2",
    "scikit-learn>=1.8.0"
]

dev = [
    # Both tests/ and the manual_tests/ integration checks are pytest-style;
    # UMLSL-Edit pins the same version, so one environment can run every suite.
    "pytest>=8.0"
]

[project.urls]
Repository = "https://github.com/QaisHamarneh/umlsl-toolkit"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umlsl_sim = ["scenario/scenarios/*.json"]

[tool.pytest.ini_options]
# Bare `pytest` runs the suite that needs only the base install. The checks in
# manual_tests/ need the [rl] extra and minutes rather than seconds, so they are
# asked for by name: `pytest manual_tests/`.
testpaths = ["tests"]